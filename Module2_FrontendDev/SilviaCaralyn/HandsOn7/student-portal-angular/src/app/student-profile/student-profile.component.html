<section aria-labelledby="profile-heading">
  <h2 id="profile-heading">Student Profile</h2>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <label for="name">Name</label>
    <input id="name" formControlName="name" />
    <span
      class="error-text"
      *ngIf="profileForm.get('name')?.invalid && profileForm.get('name')?.touched"
    >
      Name is required
    </span>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" />
    <span
      class="error-text"
      *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched"
    >
      Enter a valid email
    </span>

    <label for="semester">Semester</label>
    <input id="semester" type="number" formControlName="semester" />
    <span
      class="error-text"
      *ngIf="profileForm.get('semester')?.invalid && profileForm.get('semester')?.touched"
    >
      Semester must be between 1 and 8
    </span>

    <button type="submit" [disabled]="profileForm.invalid">Submit</button>
  </form>
</section>
